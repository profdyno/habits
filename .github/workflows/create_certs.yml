name: "3. Create Certificates"

on:
  workflow_call:
  workflow_dispatch:

jobs:
  validate:
    name: Validate Secrets
    uses: ./.github/workflows/validate_secrets.yml
    secrets: inherit

  create-certs:
    name: Create Certificates
    runs-on: macos-15
    needs: validate
    outputs:
      new_certificate_needed: ${{ steps.check_expiry.outputs.new_certificate_needed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: bundle install

      - name: Sync certificates
        env:
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
        run: bundle exec fastlane certs

      - name: Check certificate expiration
        id: check_expiry
        env:
          TEAMID: ${{ secrets.TEAMID }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
        run: |
          bundle exec fastlane check_and_renew_certificates
          RESULT=$(cat new_certificate_needed.txt)
          echo "new_certificate_needed=$RESULT" >> "$GITHUB_OUTPUT"

  nuke-certs:
    name: Nuke and Recreate Certificates
    runs-on: macos-15
    needs: create-certs
    if: needs.create-certs.outputs.new_certificate_needed == 'true' && vars.ENABLE_NUKE_CERTS == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: bundle install

      - name: Nuke and recreate certificates
        env:
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
        run: bundle exec fastlane nuke_certs
