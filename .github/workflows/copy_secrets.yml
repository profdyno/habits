name: "Copy secrets to callings"

# One-time helper: copies this repo's CI secrets to profdyno/callings.
# Delete this workflow after running it once.

on:
  workflow_dispatch:

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Copy secrets to profdyno/callings
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
        run: |
          for NAME in TEAMID GH_PAT MATCH_PASSWORD FASTLANE_KEY_ID FASTLANE_ISSUER_ID FASTLANE_KEY; do
            printf '%s' "${!NAME}" | gh secret set "$NAME" -R profdyno/callings
            echo "Copied $NAME"
          done
