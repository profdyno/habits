name: Habits
options:
  bundleIdPrefix: com.habits
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1

targets:
  Habits:
    type: application
    platform: iOS
    sources:
      - path: Habits
    info:
      path: Habits/Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        NSRemindersFullAccessUsageDescription: "Habits uses Reminders to track your daily habit completions."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.$(DEVELOPMENT_TEAM).habits.Habits
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_SKIP_APP_STORE_DEPLOYMENT: NO
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Habits.entitlements

  Habits-macOS:
    type: application
    platform: macOS
    sources:
      - path: Habits
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.$(DEVELOPMENT_TEAM).habits.Habits
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: "Habits uses Reminders to track your daily habit completions."
        CODE_SIGN_ENTITLEMENTS: Habits.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    entitlements:
      path: Habits.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.personal-information.calendars: true
